name: Continuous Integration on cgn

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/domains/cgn/**"
      - ".github/workflows/cgn_**"

jobs:
  code_review_prod:
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@dea3cc35e4d6a26cc8aa3b08ab22d48c0f958f77 # main
    name: Terraform Plan
    secrets: inherit
    with:
      environment: prod
      base_path: "src/domains/cgn"
      use_private_agent: true
