name: Continuous Delivery on prod functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/domains/functions**"
      - ".github/workflows/functions**.yml"

jobs:
  deploy:
    uses: pagopa/dx/.github/workflows/release-terraform-legacy-v1.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    name: Deploy
    secrets: inherit
    with:
      dir: "src/domains/functions"
      azure_environment: prod
      environment: prod
      use_private_agent: true
