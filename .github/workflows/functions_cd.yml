name: Continuous Delivery on prod functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/domains/functions**"
      - ".github/workflows/functions**.yml"

jobs:
  deploy:
    uses: pagopa/dx/.github/workflows/release-terraform-legacy-v1.yaml@1677605cbcd6fca87fba88b2ed5224b6b0ebede8 # main
    name: Deploy
    secrets: inherit
    with:
      dir: "src/domains/functions"
      azure_environment: prod
      environment: prod
      use_private_agent: true
