name: Continuous Delivery on bonus

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/domains/bonus/**"

jobs:
  release_prod:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@dea3cc35e4d6a26cc8aa3b08ab22d48c0f958f77 # main
    name: Terraform Apply
    secrets: inherit
    with:
      environment: prod
      base_path: "src/domains/bonus"
      use_private_agent: true
