name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@8ec64257f46bb8c03509d317b42fbf6a2da2c63a # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
