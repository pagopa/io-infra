name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@a48a894c64c3f04404ebe274ce9a750c903c7d70 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
