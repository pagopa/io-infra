name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
