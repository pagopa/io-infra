name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@dea3cc35e4d6a26cc8aa3b08ab22d48c0f958f77 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
