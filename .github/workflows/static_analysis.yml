name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@1677605cbcd6fca87fba88b2ed5224b6b0ebede8 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
