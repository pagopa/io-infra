name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"
      - ".github/workflows/static_analysis.yml"
  push:
    branches:
      - pre-commit-test
      - main

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@warn-outdated-precommit
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
