name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    types:
    - opened
    - synchronize
    - ready_for_review
    paths:
      - "src/**"
      - ".terraform-version"
      - ".pre-commit-config.yaml"

jobs:
  static_analysis:
    uses:  pagopa/dx/.github/workflows/static_analysis.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
