name: Continuous Delivery on cgn

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/domains/cgn/**"

jobs:
  release_prod:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    name: Terraform Apply
    secrets: inherit
    with:
      environment: prod
      base_path: "src/domains/cgn"
      use_private_agent: true
