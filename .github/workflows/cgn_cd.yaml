name: Continuous Delivery on cgn

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/domains/cgn/**"

jobs:
  release_prod:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@d025f45d6725b88af4a7b6e391f4ae13d58af13c # main
    name: Terraform Apply
    secrets: inherit
    with:
      environment: prod
      base_path: "src/domains/cgn"
      use_private_agent: true
